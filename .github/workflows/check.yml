name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python skills/image-edit-map/scripts/validate_spec.py skills/image-edit-map/examples/image-spec.example.json
      - run: python skills/image-edit-map/scripts/validate_spec.py examples/reverse-engineer/image-spec.json --image examples/product/source.png
